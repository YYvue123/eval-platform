# 编译、全量单测、密钥扫描、SBOM、前端构建
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Secret scan
        working-directory: .
        run: |
          if git ls-files | grep -E '(^|/)\.env$|credentials\.json|id_rsa$'; then
            echo "tracked secret-like file" >&2
            exit 1
          fi
          python -c "import pathlib; p=pathlib.Path('backend/app/config.py'); t=p.read_text(encoding='utf-8'); assert 'SECRET_KEY' in t"
      - name: SBOM
        working-directory: .
        run: python deploy/generate_sbom.py sbom.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Collect permissions
        run: npm run collect-permissions
      - name: Build
        run: npm run build
