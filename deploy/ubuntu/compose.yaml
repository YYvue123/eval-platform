services:
  backend:
    image: ${BACKEND_IMAGE:?required}
    env_file: /opt/eval-platform/shared/config/backend.env
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    volumes:
      - /opt/eval-platform/shared/data:/state/data
      - /opt/eval-platform/shared/uploads:/state/uploads
      - /opt/eval-platform/shared/logs:/state/logs
      - /opt/eval-platform/shared/config/certs:/state/certs:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    networks: [app]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '5'}
  web:
    image: ${WEB_IMAGE:?required}
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - /opt/eval-platform/shared/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/eval-platform/shared/config/tls:/etc/nginx/tls:ro
      - /opt/eval-platform/shared/control:/control:ro
    networks: [app]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '5'}
networks:
  app:
